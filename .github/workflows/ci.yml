name: P0a checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless==4.10.0.84'
      - run: npm run check
      - run: python -m unittest discover -s tests/worker -v
      - run: npm run test:pose3d-evaluation
